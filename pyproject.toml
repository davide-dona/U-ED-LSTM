[project]
name = "u-ed-lstm"
version = "0.1.0"
description = "U-ED-LSTM baseline, kept for retraining and comparison against the probabilistic suffix prediction CVAE."
requires-python = ">=3.12"
dependencies = [
    "ipykernel",
    "jupyter",
    "notebook",
    "pandas",
    "numpy",
    "pyarrow",
    "torch",
    "scikit-learn",
    "standard-imghdr",
    "tensorboard",
    "tqdm",
]

[dependency-groups]
dev = [
    "torch-tb-profiler",
]

# On Linux, take torch from PyTorch's CUDA 12.6 index rather than PyPI. The PyPI Linux wheel is
# built against CUDA 13.0, which needs an NVIDIA driver of 580 or newer; the GPU VMs we train on
# ship a 12.5 driver, so that wheel fails at import with "The NVIDIA driver on your system is too
# old" and silently leaves us on CPU. A 12.6 build runs on a 12.5 driver under CUDA's minor version
# compatibility. Same torch version either way, so this changes where the wheel comes from and
# nothing else.
#
# macOS resolves through PyPI as before: the marker keeps the CUDA index off it, and there are no
# CUDA wheels for it to pick up regardless.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
